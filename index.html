<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Key Scanner — Windows 序號掃描器</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root {
    --bg: #0a0e1a;
    --panel: #111827;
    --border: #1e3a5f;
    --accent: #00d4ff;
    --accent2: #ff6b35;
    --success: #00ff88;
    --warn: #ffd60a;
    --text: #e2e8f0;
    --muted: #64748b;
    --glow: 0 0 20px rgba(0,212,255,0.3);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
    padding-bottom: 40px;
  }

  /* Header */
  header {
    text-align: center;
    padding: 24px 0 20px;
  }

  .logo-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 6px;
  }

  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), #0066ff);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    box-shadow: var(--glow);
  }

  h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: linear-gradient(90deg, var(--accent), #fff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    font-family: 'Share Tech Mono', monospace;
  }

  /* Step indicator */
  .steps {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    margin: 20px 0;
  }

  .step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .step-num {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    transition: all 0.3s;
    font-family: 'Share Tech Mono', monospace;
  }

  .step.active .step-num {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 12px rgba(0,212,255,0.4);
  }

  .step.done .step-num {
    background: var(--success);
    border-color: var(--success);
    color: #000;
  }

  .step-label {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .step.active .step-label { color: var(--accent); }
  .step.done .step-label { color: var(--success); }

  .step-line {
    width: 32px; height: 2px;
    background: var(--border);
    margin-bottom: 14px;
    transition: background 0.3s;
  }

  .step-line.done { background: var(--success); }

  /* Panel */
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
  }

  .panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.6;
  }

  .panel-title {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    font-family: 'Share Tech Mono', monospace;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .panel-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Camera area */
  #preview-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 4/3;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 12px;
    border: 1px solid var(--border);
  }

  #preview {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Scanning frame overlay */
  .scan-frame {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .scan-frame-inner {
    width: 80%; height: 40%;
    position: relative;
  }

  .scan-frame-inner::before,
  .scan-frame-inner::after,
  .sf-bl, .sf-br {
    content: '';
    position: absolute;
    width: 20px; height: 20px;
    border-color: var(--accent);
    border-style: solid;
  }

  .scan-frame-inner::before { top: 0; left: 0; border-width: 2px 0 0 2px; }
  .scan-frame-inner::after  { top: 0; right: 0; border-width: 2px 2px 0 0; }
  .sf-bl { bottom: 0; left: 0; border-width: 0 0 2px 2px; }
  .sf-br { bottom: 0; right: 0; border-width: 0 2px 2px 0; }

  .scan-line {
    position: absolute;
    left: 10%; right: 10%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: scan 2s ease-in-out infinite;
    box-shadow: 0 0 8px var(--accent);
  }

  @keyframes scan {
    0%   { top: 15%; opacity: 1; }
    50%  { top: 75%; opacity: 1; }
    100% { top: 15%; opacity: 1; }
  }

  .hint-overlay {
    position: absolute;
    bottom: 8px;
    left: 0; right: 0;
    text-align: center;
    font-size: 10px;
    color: rgba(255,255,255,0.5);
    font-family: 'Share Tech Mono', monospace;
    letter-spacing: 1px;
  }

  /* Captured image preview */
  #captured-wrap {
    display: none;
    position: relative;
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 12px;
    border: 1px solid var(--border);
  }

  #captured-img {
    width: 100%;
    display: block;
  }

  /* Buttons */
  .btn {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-family: 'Exo 2', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #0066ff);
    color: #000;
    box-shadow: 0 4px 20px rgba(0,212,255,0.3);
  }

  .btn-primary:active { transform: scale(0.97); }

  .btn-secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    font-size: 11px;
    padding: 10px;
    margin-top: 8px;
  }

  .btn-secondary:active { background: rgba(255,255,255,0.05); }

  .btn-success {
    background: linear-gradient(135deg, var(--success), #00aa55);
    color: #000;
    box-shadow: 0 4px 20px rgba(0,255,136,0.3);
  }

  .btn-warn {
    background: linear-gradient(135deg, var(--accent2), #ff3355);
    color: #fff;
    box-shadow: 0 4px 20px rgba(255,107,53,0.3);
  }

  .btn:disabled {
    opacity: 0.4;
    pointer-events: none;
  }

  /* Key display */
  .key-display {
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 14px;
    font-family: 'Share Tech Mono', monospace;
  }

  .key-label {
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .key-value {
    font-size: 18px;
    letter-spacing: 4px;
    color: var(--warn);
    word-break: break-all;
    line-height: 1.6;
  }

  .key-value span {
    color: var(--text);
  }

  .key-value .dash { color: var(--muted); }

  /* Editable key input */
  #key-input {
    width: 100%;
    min-height: 116px;
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 18px;
    line-height: 1.65;
    letter-spacing: 3px;
    color: var(--warn);
    text-transform: uppercase;
    outline: none;
    margin-bottom: 12px;
    resize: none;
    overflow: hidden;
    white-space: pre;
    transition: border-color 0.2s;
  }

  #key-input:focus { border-color: var(--accent); }
  #key-input::placeholder { color: var(--muted); letter-spacing: 2px; font-size: 12px; }

  /* OCR status */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 11px;
    font-family: 'Share Tech Mono', monospace;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }

  .status-bar.processing {
    background: rgba(0,212,255,0.1);
    border: 1px solid rgba(0,212,255,0.2);
    color: var(--accent);
  }

  .status-bar.success {
    background: rgba(0,255,136,0.1);
    border: 1px solid rgba(0,255,136,0.2);
    color: var(--success);
  }

  .status-bar.error {
    background: rgba(255,107,53,0.1);
    border: 1px solid rgba(255,107,53,0.2);
    color: var(--accent2);
  }

  .status-bar.warning {
    background: rgba(255,214,10,0.1);
    border: 1px solid rgba(255,214,10,0.2);
    color: var(--warn);
  }

  .spinner {
    width: 12px; height: 12px;
    border: 2px solid rgba(0,212,255,0.3);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .progress-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-bottom: 12px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #0066ff);
    border-radius: 2px;
    transition: width 0.3s;
    box-shadow: 0 0 8px var(--accent);
  }

  /* QR Code area */
  #qr-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  #qr-box {
    width: 200px; height: 200px;
    background: #fff;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    box-shadow: 0 0 30px rgba(0,212,255,0.3), 0 0 60px rgba(0,212,255,0.1);
    border: 3px solid var(--accent);
  }

  #qr-box canvas, #qr-box img { border-radius: 4px; }

  .qr-hint {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.6;
    font-family: 'Share Tech Mono', monospace;
  }

  .qr-key-confirm {
    background: rgba(0,255,136,0.05);
    border: 1px solid rgba(0,255,136,0.2);
    border-radius: 8px;
    padding: 10px 16px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--success);
    letter-spacing: 3px;
    text-align: center;
    width: 100%;
    word-break: break-all;
  }

  /* Hidden input for file */
  #file-input { display: none; }

  /* Divider */
  .or-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 2px;
    margin: 10px 0;
  }

  .or-divider::before, .or-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Counter */
  .counter-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(0,212,255,0.1);
    border: 1px solid rgba(0,212,255,0.2);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 10px;
    font-family: 'Share Tech Mono', monospace;
    color: var(--accent);
    letter-spacing: 1px;
    margin-bottom: 14px;
  }

  .counter-num {
    font-size: 16px;
    font-weight: 800;
    color: var(--warn);
  }

  /* Reset / new scan */
  .reset-area {
    text-align: center;
    margin-top: 10px;
  }

  /* Pulse dot */
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--success);
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  /* Section hidden/visible */
  .section { display: none; }
  .section.active { display: block; }

  /* Camera stream */
  #stream { display: none; }
  #stream.active { display: block; }

  video#stream {
    width: 100%; height: 100%;
    object-fit: cover;
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo-line">
      <div class="logo-icon">🔑</div>
      <h1>Key Scanner</h1>
    </div>
    <div class="subtitle">Windows 序號辨識系統</div>
  </header>

  <!-- Step indicator -->
  <div class="steps" id="steps">
    <div class="step active" id="s1">
      <div class="step-num">01</div>
      <div class="step-label">拍照</div>
    </div>
    <div class="step-line" id="l1"></div>
    <div class="step active" id="s2">
      <div class="step-num">02</div>
      <div class="step-label">辨識</div>
    </div>
    <div class="step-line" id="l2"></div>
    <div class="step" id="s3">
      <div class="step-num">03</div>
      <div class="step-label">確認</div>
    </div>
    <div class="step-line" id="l3"></div>
    <div class="step" id="s4">
      <div class="step-num">04</div>
      <div class="step-label">QR碼</div>
    </div>
  </div>

  <!-- 完成計數 -->
  <div style="text-align:center;">
    <div class="counter-badge">
      <span>已完成</span>
      <span class="counter-num" id="done-count">0</span>
      <span>台</span>
    </div>
  </div>

  <!-- API Key 設定 -->
  <div class="panel" id="sec-apikey" style="border-color: rgba(255,214,10,0.3);">
    <div class="panel-title" style="color:var(--warn);">Gemini API Key 設定</div>
    <div style="font-size:11px; color:var(--muted); font-family:'Share Tech Mono',monospace; margin-bottom:10px; line-height:1.6;">
      前往 <a href="https://aistudio.google.com/apikey" target="_blank" style="color:var(--accent);">aistudio.google.com</a> 免費取得 API Key
    </div>
    <input type="password" id="gemini-key-input"
      placeholder="貼上你的 Gemini API Key..."
      style="width:100%; background:rgba(0,0,0,0.4); border:1px solid var(--border); border-radius:10px; padding:12px 14px; font-family:'Share Tech Mono',monospace; font-size:13px; color:var(--warn); outline:none; margin-bottom:10px;"
    >
    <button class="btn btn-primary" onclick="saveApiKey()" style="background:linear-gradient(135deg,var(--warn),#ff9500); color:#000;">
      💾 儲存並開始使用
    </button>
    <div id="apikey-hint" style="margin-top:8px; font-size:10px; font-family:'Share Tech Mono',monospace; color:var(--muted); text-align:center;"></div>
  </div>

  <!-- STEP 1: 拍照 -->
  <div class="panel section active" id="sec-capture">
    <div class="panel-title">步驟 01 — 拍攝貼紙</div>

    <div id="preview-wrap">
      <video id="stream" autoplay playsinline></video>
      <img id="preview" src="" alt="" style="display:none;">
      <div class="scan-frame">
        <div class="scan-frame-inner">
          <div class="sf-bl"></div>
          <div class="sf-br"></div>
          <div class="scan-line"></div>
        </div>
      </div>
      <div class="hint-overlay">將序號貼紙對準框內</div>
    </div>

    <button class="btn btn-primary" id="btn-camera" onclick="startCamera()">
      📷 開啟相機
    </button>

    <button class="btn btn-primary" id="btn-shoot" onclick="shootPhoto()" style="display:none;">
      ⚡ 拍照辨識
    </button>

    <div class="or-divider">或</div>

    <input type="file" id="file-input" accept="image/*" onchange="handleFile(event)">
    <button class="btn btn-secondary" onclick="document.getElementById('file-input').click()">
      🖼️ 從相簿選擇圖片
    </button>
  </div>

  <!-- STEP 2: OCR 處理中 -->
  <div class="panel section" id="sec-ocr">
    <div class="panel-title">步驟 02 — AI 辨識中</div>

    <div id="captured-wrap">
      <img id="captured-img" src="" alt="">
    </div>

    <div class="status-bar processing" id="ocr-status">
      <div class="spinner"></div>
      <span id="ocr-status-text">初始化辨識引擎...</span>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>

    <div id="ocr-raw-wrap" style="margin-top:10px;">
      <div style="font-size:9px; letter-spacing:2px; color:var(--muted); font-family:'Share Tech Mono',monospace; margin-bottom:6px; text-transform:uppercase;">OCR 原始辨識文字</div>
      <div id="ocr-raw" style="font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--muted); background:rgba(0,0,0,0.3); border-radius:8px; padding:10px; white-space:pre-wrap; word-break:break-all; max-height:120px; overflow-y:auto; min-height:36px;">等待辨識...</div>
    </div>
  </div>

  <!-- STEP 3: 確認序號 -->
  <div class="panel section" id="sec-confirm">
    <div class="panel-title">步驟 03 — 確認序號</div>

    <div class="key-label" style="font-size:10px; letter-spacing:2px; color:var(--muted); margin-bottom:8px; font-family:'Share Tech Mono',monospace;">辨識結果（可手動修正）</div>

    <textarea
      id="key-input"
      placeholder="XXXXX-XXXXX-
XXXXX-XXXXX-
XXXXX"
      rows="3"
      maxlength="35"
      oninput="formatKeyInput(this)"
    ></textarea>

    <div id="key-valid-hint" style="font-size:10px; font-family:'Share Tech Mono',monospace; margin-bottom:12px; color:var(--muted);"></div>

    <button class="btn btn-success" id="btn-gen-qr" onclick="generateQR()">
      ✅ 確認，產生 QR Code
    </button>

    <button class="btn btn-secondary" onclick="resetAll()">
      🔄 重新拍照
    </button>
  </div>

  <!-- STEP 4: QR Code -->
  <div class="panel section" id="sec-qr">
    <div class="panel-title">步驟 04 — 掃描 QR Code</div>

    <div id="qr-wrap">
      <div id="qr-box"></div>
      <div class="qr-key-confirm" id="qr-key-text"></div>
      <div class="qr-hint">
        <div>用藍牙條碼槍掃描上方 QR Code</div>
        <div style="margin-top:4px; color:var(--success);">▶ 自動輸入到 Windows 啟動視窗</div>
      </div>
    </div>

    <div style="margin-top:16px;">
      <button class="btn btn-warn" onclick="nextDevice()">
        ➡️ 下一台（重新掃描）
      </button>
    </div>
  </div>

</div>

<!-- Hidden canvas for capture -->
<canvas id="capture-canvas" style="display:none;"></canvas>

<script>
let stream = null;
let doneCount = 0;
let currentKey = '';
let scanRunId = 0;

// Load saved API key on startup
window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('gemini_api_key');
  if (saved) {
    document.getElementById('gemini-key-input').value = saved;
    document.getElementById('apikey-hint').textContent = '✓ 已載入儲存的 Key';
    document.getElementById('apikey-hint').style.color = 'var(--success)';
    document.getElementById('sec-apikey').style.borderColor = 'rgba(0,255,136,0.3)';
  }
});

// ─── Camera ───────────────────────────────────────────────
async function startCamera() {
  try {
    const s = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    stream = s;
    const video = document.getElementById('stream');
    video.srcObject = s;
    video.style.display = 'block';
    document.getElementById('preview').style.display = 'none';
    document.getElementById('btn-camera').style.display = 'none';
    document.getElementById('btn-shoot').style.display = 'flex';
  } catch (e) {
    alert('無法開啟相機，請改用相簿選圖功能。');
  }
}

function shootPhoto() {
  const video = document.getElementById('stream');
  const canvas = document.getElementById('capture-canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
  processImageV2(dataUrl);
}

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => processImageV2(ev.target.result);
  reader.readAsDataURL(file);
}

// ─── API Key 管理 ─────────────────────────────────────────
function saveApiKey() {
  const key = document.getElementById('gemini-key-input').value.trim();
  if (!key) {
    document.getElementById('apikey-hint').textContent = '請輸入 API Key';
    return;
  }
  localStorage.setItem('gemini_api_key', key);
  document.getElementById('apikey-hint').style.color = 'var(--success)';
  document.getElementById('apikey-hint').textContent = '✓ 已儲存！';
  document.getElementById('sec-apikey').style.borderColor = 'rgba(0,255,136,0.3)';
}

function getApiKey() {
  return localStorage.getItem('gemini_api_key') || '';
}

async function processImageV2(dataUrl) {
  const runId = ++scanRunId;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }

  const apiKey = getApiKey();

  document.getElementById('captured-img').src = dataUrl;
  document.getElementById('captured-wrap').style.display = 'block';
  showSection('sec-ocr');
  setStep(2);

  const statusEl = document.getElementById('ocr-status-text');
  const progressEl = document.getElementById('progress-fill');

  statusEl.textContent = 'Preparing image crops...';
  progressEl.style.width = '20%';

  try {
    const images = await prepareKeyImages(dataUrl);
    if (runId !== scanRunId) return;
    if (images[0]?.dataUrl) {
      document.getElementById('captured-img').src = images[0].dataUrl;
    }
    progressEl.style.width = '35%';
    statusEl.textContent = 'Running local OCR...';

    let ocrResult;
    let rawText = '';
    let key = '';

    try {
      ocrResult = await readWindowsKeyLocally(images, progressEl, statusEl);
      if (runId !== scanRunId) return;
      rawText = ocrResult.text;
      key = normalizeProductKey(rawText);
    } catch (localErr) {
      if (!apiKey) throw localErr;
      rawText = `Local OCR failed: ${localErr.message}`;
    }

    if (!key && apiKey) {
      progressEl.style.width = '65%';
      statusEl.textContent = 'Local OCR unclear. Trying Gemini fallback...';
      ocrResult = await readWindowsKeyWithGemini(apiKey, images);
      if (runId !== scanRunId) return;
      rawText = ocrResult.text;
      const result = parseGeminiKeyResult(rawText);
      key = normalizeProductKey(result.key || rawText);
    }

    progressEl.style.width = '100%';
    document.getElementById('ocr-raw').textContent = [
      rawText,
      '',
      `OCR: ${ocrResult.model}`,
      key ? `Detected: ${key}` : 'Detected: NOT_FOUND'
    ].join('\n');

    if (key) {
      setOcrStatus('success', `${ocrResult.model} found a possible product key.`);
      showConfirm(key);
    } else {
      setOcrStatus('warning', 'No complete 25-character key found. Please edit manually.');
      showConfirm('');
    }
  } catch (err) {
    if (runId !== scanRunId) return;
    progressEl.style.width = '100%';
    setOcrStatus('error', `OCR failed: ${err.message}`);
    document.getElementById('ocr-raw').textContent = err.message;
    showConfirm('');
  }
}

async function readWindowsKeyWithGemini(apiKey, images) {
  const prompt = [
    'You are reading a Microsoft Windows COA/product-key label photo.',
    'Find ONLY the Windows product key printed as 5 groups of 5 uppercase letters/numbers.',
    'The key is usually near the center-right/lower-right of the sticker, close to a small empty square checkbox.',
    'Ignore barcodes, QR codes, website text, part numbers, dates, labels, and "Windows 11 IOT".',
    'Return strict JSON only:',
    '{"key":"XXXXX-XXXXX-XXXXX-XXXXX-XXXXX","confidence":0.0,"notes":"short"}',
    'If you cannot read all 25 characters, return {"key":"NOT_FOUND","confidence":0,"notes":"why"}.',
    'Common confusions: O/0, I/1, S/5, B/8, G/6, Z/2. Do not invent missing characters.',
    'Example from this label style: YH9MB-GTNPG-CJG29-RQJ4R-MWV23'
  ].join('\n');

  const parts = [{ text: prompt }];
  images.forEach(img => {
    parts.push({ text: `Image variant: ${img.label}` });
    parts.push({ inline_data: { mime_type: img.mimeType, data: img.base64 } });
  });

  const models = [
    'gemini-2.0-flash-lite',
    'gemini-2.5-flash-lite',
    'gemini-2.0-flash'
  ];
  const errors = [];

  for (const model of models) {
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts }],
          generationConfig: {
            temperature: 0,
            maxOutputTokens: 160,
            responseMimeType: 'application/json'
          }
        })
      }
    );

    if (res.ok) {
      const data = await res.json();
      return {
        model,
        text: data.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('\n').trim() || ''
      };
    }

    const err = await res.json().catch(() => ({}));
    const message = err.error?.message || `HTTP ${res.status}`;
    errors.push(`${model}: ${message}`);

    if (!isQuotaError(res.status, message)) {
      throw new Error(message);
    }
  }

  throw new Error(`All Gemini models are out of quota or unavailable:\n${errors.join('\n')}`);
}

function isQuotaError(status, message) {
  return status === 429 || /quota|RESOURCE_EXHAUSTED|rate limit/i.test(message);
}

async function readWindowsKeyLocally(images, progressEl, statusEl) {
  if (!window.Tesseract) {
    throw new Error('Local OCR engine did not load. Please check internet connection for Tesseract.js.');
  }
  const localOcr = window.Tesseract;

  const texts = [];
  for (let i = 0; i < images.length; i++) {
    const img = images[i];
    statusEl.textContent = `Running local OCR (${i + 1}/${images.length})...`;
    const baseProgress = 35 + Math.round((i / images.length) * 25);

    const result = await localOcr.recognize(img.dataUrl, 'eng', {
      tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789- ',
      preserve_interword_spaces: '1',
      logger: m => {
        if (m.status === 'recognizing text' && typeof m.progress === 'number') {
          progressEl.style.width = `${baseProgress + Math.round(m.progress * 20)}%`;
        }
      }
    });

    const text = cleanupOcrText(result.data?.text || '');
    texts.push(`--- ${img.label} ---\n${text}`);

    const key = normalizeProductKey(text);
    if (key) {
      return {
        model: 'Local OCR',
        text: `${texts.join('\n\n')}\n\n${key}`
      };
    }
  }

  return {
    model: 'Local OCR',
    text: texts.join('\n\n')
  };
}

function cleanupOcrText(text) {
  return String(text || '')
    .toUpperCase()
    .replace(/[^\w\-\s]/g, ' ')
    .replace(/\bWINDOWS\b|\bMICROSOFT\b|\bSOFTWARE\b|\bHOWTOTELL\b/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function parseGeminiKeyResult(text) {
  try {
    const cleaned = text.replace(/^```json/i, '').replace(/^```/, '').replace(/```$/, '').trim();
    return JSON.parse(cleaned);
  } catch {
    return { key: text };
  }
}

function normalizeProductKey(value) {
  if (!value || /NOT[_\s-]?FOUND/i.test(value)) return '';
  const upper = String(value).toUpperCase();
  const direct = upper.match(/[A-Z0-9]{5}[-\s]?[A-Z0-9]{5}[-\s]?[A-Z0-9]{5}[-\s]?[A-Z0-9]{5}[-\s]?[A-Z0-9]{5}/);
  if (!direct) return '';
  const compact = direct[0].replace(/[^A-Z0-9]/g, '').slice(0, 25);
  if (compact.length !== 25) return '';
  return compact.match(/.{1,5}/g).join('-');
}

function dataUrlToImage(dataUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('Could not load image.'));
    img.src = dataUrl;
  });
}

async function prepareKeyImages(dataUrl) {
  const img = await dataUrlToImage(dataUrl);
  const variants = [];
  const addVariant = (label, rect, mode = 'normal') => {
    const canvas = document.createElement('canvas');
    const enhance = mode !== 'normal';
    const scale = enhance ? 2.6 : 1.4;
    canvas.width = Math.round(rect.w * scale);
    canvas.height = Math.round(rect.h * scale);
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, rect.x, rect.y, rect.w, rect.h, 0, 0, canvas.width, canvas.height);
    if (enhance) enhanceForOcr(ctx, canvas.width, canvas.height, mode);
    const url = canvas.toDataURL('image/jpeg', 0.92);
    variants.push({
      label,
      dataUrl: url,
      mimeType: 'image/jpeg',
      base64: url.split(',')[1]
    });
  };

  const w = img.naturalWidth || img.width;
  const h = img.naturalHeight || img.height;
  const marker = findKeySymbolMarker(img, w, h);
  const keyStartBand = marker
    ? clampRect({
        x: marker.x - w * 0.01,
        y: marker.y - marker.h * 2.2,
        w: Math.min(w * 0.66, w - marker.x),
        h: Math.max(marker.h * 9, h * 0.18)
      }, w, h)
    : { x: w * 0.25, y: h * 0.43, w: w * 0.62, h: h * 0.24 };
  const keyOnlyBand = marker
    ? clampRect({
        x: marker.x + marker.w * 0.75,
        y: marker.y - marker.h * 1.8,
        w: Math.min(w * 0.58, w - marker.x - marker.w * 0.75),
        h: Math.max(marker.h * 8, h * 0.16)
      }, w, h)
    : { x: w * 0.34, y: h * 0.48, w: w * 0.50, h: h * 0.20 };
  const rightKeyBand = marker
    ? clampRect({
        x: marker.x + marker.w,
        y: marker.y - marker.h * 2.5,
        w: Math.min(w * 0.56, w - marker.x - marker.w),
        h: Math.max(marker.h * 10, h * 0.22)
      }, w, h)
    : { x: w * 0.40, y: h * 0.38, w: w * 0.52, h: h * 0.34 };
  addVariant(marker ? 'detected key symbol - inverted' : 'from key symbol - inverted', keyStartBand, 'invert');
  addVariant(marker ? 'detected key symbol - black text' : 'from key symbol - black text', keyStartBand, 'threshold');
  addVariant('key only - inverted', keyOnlyBand, 'invert');
  addVariant('right key area - inverted', rightKeyBand, 'invert');
  addVariant('full label reference', { x: 0, y: 0, w, h }, 'normal');
  return variants;
}

function clampRect(rect, maxW, maxH) {
  const x = Math.max(0, Math.min(maxW - 1, rect.x));
  const y = Math.max(0, Math.min(maxH - 1, rect.y));
  const w = Math.max(1, Math.min(maxW - x, rect.w));
  const h = Math.max(1, Math.min(maxH - y, rect.h));
  return { x, y, w, h };
}

function findKeySymbolMarker(img, w, h) {
  const search = {
    x: Math.floor(w * 0.16),
    y: Math.floor(h * 0.34),
    w: Math.floor(w * 0.30),
    h: Math.floor(h * 0.24)
  };
  const sample = 2;
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.floor(search.w / sample));
  canvas.height = Math.max(1, Math.floor(search.h / sample));
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, search.x, search.y, search.w, search.h, 0, 0, canvas.width, canvas.height);
  const { data } = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const cols = new Array(canvas.width).fill(0);
  const rows = new Array(canvas.height).fill(0);

  for (let y = 0; y < canvas.height; y++) {
    for (let x = 0; x < canvas.width; x++) {
      const i = (y * canvas.width + x) * 4;
      const r = data[i], g = data[i + 1], b = data[i + 2];
      const dark = r < 95 && g < 95 && b < 95 && Math.max(r, g, b) - Math.min(r, g, b) < 55;
      if (dark) {
        cols[x]++;
        rows[y]++;
      }
    }
  }

  const colLimit = Math.max(2, canvas.height * 0.035);
  const rowLimit = Math.max(2, canvas.width * 0.030);
  const xRange = findDenseRange(cols, colLimit, 3);
  const yRange = findDenseRange(rows, rowLimit, 2);
  if (!xRange || !yRange) return null;

  const box = {
    x: search.x + xRange.start * sample,
    y: search.y + yRange.start * sample,
    w: Math.max(1, (xRange.end - xRange.start + 1) * sample),
    h: Math.max(1, (yRange.end - yRange.start + 1) * sample)
  };
  const ratio = box.w / box.h;
  if (box.w < w * 0.035 || box.w > w * 0.18 || box.h < h * 0.008 || box.h > h * 0.08) return null;
  if (ratio < 2.0 || ratio > 9.0) return null;
  return box;
}

function findDenseRange(values, threshold, gapLimit) {
  let best = null;
  let start = -1;
  let end = -1;
  let gap = 0;
  for (let i = 0; i < values.length; i++) {
    if (values[i] >= threshold) {
      if (start < 0) start = i;
      end = i;
      gap = 0;
    } else if (start >= 0) {
      gap++;
      if (gap > gapLimit) {
        const candidate = { start, end };
        if (!best || candidate.end - candidate.start > best.end - best.start) best = candidate;
        start = -1;
        end = -1;
        gap = 0;
      }
    }
  }
  if (start >= 0) {
    const candidate = { start, end };
    if (!best || candidate.end - candidate.start > best.end - best.start) best = candidate;
  }
  return best && best.end >= best.start ? best : null;
}

function enhanceForOcr(ctx, width, height, mode = 'threshold') {
  const imageData = ctx.getImageData(0, 0, width, height);
  const data = imageData.data;
  for (let i = 0; i < data.length; i += 4) {
    const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
    const contrast = Math.max(0, Math.min(255, (gray - 128) * 2.1 + 128));
    const bw = contrast < 165 ? 0 : 255;
    const value = mode === 'invert' ? 255 - bw : bw;
    data[i] = data[i + 1] = data[i + 2] = value;
  }
  ctx.putImageData(imageData, 0, 0);
}

// ─── Gemini Vision OCR ────────────────────────────────────
async function processImage(dataUrl) {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }

  const apiKey = getApiKey();
  if (!apiKey) {
    alert('請先輸入 Gemini API Key！');
    return;
  }

  document.getElementById('captured-img').src = dataUrl;
  document.getElementById('captured-wrap').style.display = 'block';
  showSection('sec-ocr');
  setStep(2);

  const statusEl = document.getElementById('ocr-status-text');
  const progressEl = document.getElementById('progress-fill');

  statusEl.textContent = '傳送圖片給 Gemini AI...';
  progressEl.style.width = '30%';

  // Convert dataUrl to base64
  const base64 = dataUrl.split(',')[1];
  const mimeType = dataUrl.split(';')[0].split(':')[1];

  const prompt = `這是一張 Windows COA 授權貼紙的照片。
請找出貼紙上的 Windows Product Key（序號）。
序號格式是 25 個英數字，通常以鑰匙圖示（🔑 或 ⚿）標示，分成 5 組每組 5 碼，用 · 或 - 分隔。
例如：YH9MB-GTNPG-CJG29-RQJ4R-MWV23

請只回傳序號本身，格式為 XXXXX-XXXXX-XXXXX-XXXXX-XXXXX，不要其他文字。
如果找不到序號，回傳 NOT_FOUND。`;

  try {
    progressEl.style.width = '60%';
    statusEl.textContent = 'Gemini 辨識中...';

    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [
              { inline_data: { mime_type: mimeType, data: base64 } },
              { text: prompt }
            ]
          }],
          generationConfig: { temperature: 0, maxOutputTokens: 64 }
        })
      }
    );

    progressEl.style.width = '90%';

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error?.message || res.status);
    }

    const data = await res.json();
    const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || '';
    progressEl.style.width = '100%';

    document.getElementById('ocr-raw').textContent = rawText;

    if (rawText && rawText !== 'NOT_FOUND') {
      // Clean up response - extract key pattern
      const match = rawText.match(/[A-Z0-9]{5}-[A-Z0-9]{5}-[A-Z0-9]{5}-[A-Z0-9]{5}-[A-Z0-9]{5}/);
      const key = match ? match[0] : rawText.replace(/[^A-Z0-9\-]/g, '').slice(0, 29);
      setOcrStatus('success', '✓ Gemini 辨識成功！');
      setTimeout(() => showConfirm(key), 500);
    } else {
      setOcrStatus('warning', '⚠ 未找到序號，請手動輸入');
      setTimeout(() => showConfirm(''), 600);
    }
  } catch (err) {
    progressEl.style.width = '100%';
    setOcrStatus('error', `✗ 錯誤：${err.message}`);
    document.getElementById('ocr-raw').textContent = err.message;
    setTimeout(() => showConfirm(''), 800);
  }
}

function setOcrStatus(type, msg) {
  const el = document.getElementById('ocr-status');
  el.className = `status-bar ${type}`;
  el.innerHTML = type === 'success'
    ? `<div class="dot"></div><span>${msg}</span>`
    : type === 'error' || type === 'warning'
      ? `<span>⚠</span><span>${msg}</span>`
      : `<div class="spinner"></div><span>${msg}</span>`;
}

// ─── Confirm ──────────────────────────────────────────────
function showConfirm(key) {
  showSection('sec-confirm');
  setStep(3);
  const input = document.getElementById('key-input');
  input.value = formatKeyForDisplay(key);
  validateKey(input.value);
  document.getElementById('sec-confirm').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function formatKeyInput(el) {
  let v = el.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
  const out = formatKeyForDisplay(v);
  el.value = out;
  validateKey(out);
}

function formatKeyForDisplay(key) {
  const clean = String(key || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase().slice(0, 25);
  const groups = clean.match(/.{1,5}/g) || [];
  const line1 = groups.slice(0, 2).join('-');
  const line2 = groups.slice(2, 4).join('-');
  const line3 = groups.slice(4, 5).join('-');
  return [line1, line2, line3].filter(Boolean).map((line, idx) => {
    const needsDash = idx < 2 && line.replace(/-/g, '').length === 10;
    return needsDash ? `${line}-` : line;
  }).join('\n');
}

function getNormalizedKeyFromInput() {
  const clean = document.getElementById('key-input').value.replace(/[^A-Za-z0-9]/g, '').toUpperCase().slice(0, 25);
  return clean.length === 25 ? clean.match(/.{1,5}/g).join('-') : '';
}

function validateKey(key) {
  const hint = document.getElementById('key-valid-hint');
  const btn = document.getElementById('btn-gen-qr');
  const clean = key.replace(/[^A-Za-z0-9]/g, '');
  if (clean.length === 25) {
    hint.textContent = '✓ 格式正確 (25碼)';
    hint.style.color = 'var(--success)';
    btn.disabled = false;
  } else {
    hint.textContent = `已輸入 ${clean.length}/25 碼`;
    hint.style.color = clean.length > 0 ? 'var(--warn)' : 'var(--muted)';
    btn.disabled = clean.length !== 25;
  }
}

// ─── QR Code ──────────────────────────────────────────────
function generateQR() {
  const key = getNormalizedKeyFromInput();
  currentKey = key;

  showSection('sec-qr');
  setStep(4);

  document.getElementById('qr-key-text').textContent = key;

  const box = document.getElementById('qr-box');
  box.innerHTML = '';

  new QRCode(box, {
    text: key,
    width: 176,
    height: 176,
    colorDark: '#000000',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.H
  });
  document.getElementById('sec-qr').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ─── Navigation ───────────────────────────────────────────
function nextDevice() {
  doneCount++;
  document.getElementById('done-count').textContent = doneCount;
  resetAll();
}

function resetAll() {
  scanRunId++;
  currentKey = '';
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }

  document.getElementById('btn-camera').style.display = 'flex';
  document.getElementById('btn-shoot').style.display = 'none';
  const video = document.getElementById('stream');
  video.srcObject = null;
  video.style.display = 'none';
  const preview = document.getElementById('preview');
  preview.src = '';
  preview.style.display = 'none';
  document.getElementById('captured-img').src = '';
  document.getElementById('captured-wrap').style.display = 'none';
  document.getElementById('file-input').value = '';
  document.getElementById('key-input').value = '';
  document.getElementById('qr-box').innerHTML = '';
  document.getElementById('qr-key-text').textContent = '';
  document.getElementById('ocr-raw').textContent = 'Waiting for OCR...';
  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('btn-gen-qr').disabled = true;
  setOcrStatus('processing', 'Waiting for image...');

  showSection('sec-capture');
  setStep(1);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function setStep(n) {
  for (let i = 1; i <= 4; i++) {
    const s = document.getElementById('s' + i);
    s.classList.remove('active', 'done');
    if (i < n) s.classList.add('done');
    else if (i === n) s.classList.add('active');
  }
  for (let i = 1; i <= 3; i++) {
    const l = document.getElementById('l' + i);
    l.classList.toggle('done', i < n);
  }
}
